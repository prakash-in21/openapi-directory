openapi: 3.1.0
info:
  title: PixelAPI
  description: 'AI-powered image processing API running on privately-owned GPUs.


    ## What it does

    - **Background Removal** — BiRefNet model, transparent PNG output, $0.005/image

    - **AI Product Photography** — one-call pipeline: remove BG + generate new background
    (studio, marble, outdoor), $0.075/image

    - **Image Generation** — FLUX Schnell, FLUX Dev, SDXL, $0.001/image

    - **4x Upscaling** — Real-ESRGAN, $0.005/image

    - **Virtual Try-On** — CatVTON/OOTDiffusion, garment on model, $0.050/image

    - **Object Removal** — inpainting-based, $0.020/image

    - **Text Removal** — $0.020/image

    - **Face Restoration** — GFPGAN, $0.005/image

    - **AI Product Shadows** — soft/hard/natural/floating, $0.010/image

    - **Image Captioning** — BLIP-based, returns description + SEO tags + alt text,
    $0.005/image

    - **Outpainting** — extend image borders, $0.030/image

    - **Text-to-Video** — Wan 2.1, $TBD/video


    ## Pricing

    Starts at $0.001/image. 5-10x cheaper than Replicate or fal.ai for equivalent
    models.

    Starter plan: $10/10K credits. Pro: $50/60K. Scale: $200/300K.


    ## Auth

    Bearer token via `Authorization` header or `X-API-Key` header.'
  version: 1.0.0
  x-logo:
    url: https://pixelapi.dev/apple-touch-icon.png
    backgroundColor: '#09090b'
  contact:
    email: support@pixelapi.dev
    url: https://pixelapi.dev
  license:
    name: Proprietary
  termsOfService: https://pixelapi.dev/terms.html
  x-providerName: pixelapi.dev
