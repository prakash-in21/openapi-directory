  /v1/payments/create-subscription:
    post:
      tags:
      - Payments
      summary: Create Subscription
      description: 'Create a PayPal subscription for the authenticated user.


        1. Validates the requested plan exists

        2. Looks up the PayPal plan ID from our database

        3. Creates a subscription via PayPal API

        4. Returns the approval URL for the user to complete payment on PayPal


        The user''s plan is NOT activated here — that happens via webhook

        when PayPal confirms the subscription is active.'
      operationId: create_subscription_v1_payments_create_subscription_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSubscriptionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/payments/webhook:
    post:
      tags:
      - Payments
      summary: Paypal Webhook
      description: 'PayPal webhook handler — receives subscription lifecycle events.


        This endpoint is called by PayPal''s servers (not by the user).

        It must be publicly accessible and registered in PayPal''s developer dashboard.


        Events we handle:

        - BILLING.SUBSCRIPTION.ACTIVATED: User approved subscription → activate plan
        + add credits

        - PAYMENT.SALE.COMPLETED: Recurring payment succeeded → refresh credits for
        new period

        - BILLING.SUBSCRIPTION.CANCELLED: User or merchant cancelled → downgrade at
        period end

        - BILLING.SUBSCRIPTION.SUSPENDED: Payment failed → suspend immediately

        - BILLING.SUBSCRIPTION.EXPIRED: Subscription reached end → downgrade to free


        Security:

        - Webhook signature is verified via PayPal''s verification endpoint

        - Event IDs are stored to prevent duplicate processing (idempotency)

        - Payment amounts are verified against our plan prices'
      operationId: paypal_webhook_v1_payments_webhook_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/payments/generate-invoice:
    post:
      tags:
      - Payments
      summary: Generate Invoice Now
      description: 'Called from the billing address modal (client-side) right after
        the user fills their address.

        Picks the most recent payment without a zoho_invoice_id and generates the
        Zoho invoice.'
      operationId: generate_invoice_now_v1_payments_generate_invoice_post
      responses:
