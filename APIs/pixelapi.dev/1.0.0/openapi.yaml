      security:
      - HTTPBearer: []
  /v1/payments/subscription-status:
    get:
      tags:
      - Payments
      summary: Get Subscription Status
      description: 'Get the current user''s subscription status.


        Also checks if a cancelled subscription has expired and downgrades if needed.

        This is a "lazy check" that supplements the webhook-based approach.'
      operationId: get_subscription_status_v1_payments_subscription_status_get
      responses:
