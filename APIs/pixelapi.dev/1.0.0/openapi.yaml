components:
  schemas:
    AIShadowRequest:
      properties:
        image_url:
          type: string
          title: Image Url
          description: URL of the image to add shadow to
        shadow_type:
          type: string
          pattern: ^(soft|hard|natural|floating)$
          title: Shadow Type
          default: soft
        shadow_opacity:
          type: number
          maximum: 1.0
          minimum: 0.1
          title: Shadow Opacity
          default: 0.5
        shadow_blur:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Shadow Blur
          default: 25
        shadow_offset_x:
          type: integer
          maximum: 100.0
          minimum: -100.0
          title: Shadow Offset X
          default: 0
        shadow_offset_y:
          type: integer
          maximum: 100.0
          minimum: -100.0
          title: Shadow Offset Y
          default: 20
        background_color:
          items:
            type: integer
          type: array
          maxItems: 3
          minItems: 3
          title: Background Color
          default:
          - 255
          - 255
          - 255
      type: object
      required:
      - image_url
      title: AIShadowRequest
    AIShadowResponse:
      properties:
        generation_id:
          type: string
          title: Generation Id
        status:
          type: string
          title: Status
        credits_used:
          type: number
          title: Credits Used
      type: object
      required:
      - generation_id
      - status
      - credits_used
      title: AIShadowResponse
    AudioGenerateRequest:
      properties:
        prompt:
          type: string
          maxLength: 500
          minLength: 3
          title: Prompt
          description: Text description of the music to generate
        duration:
          type: integer
          maximum: 30.0
          minimum: 5.0
          title: Duration
          description: Duration in seconds (5-30)
          default: 15
        model:
          type: string
          title: Model
          description: Model to use
          default: musicgen-small
      type: object
      required:
      - prompt
      title: AudioGenerateRequest
    AuthResponse:
      properties:
        api_key:
          type: string
          title: Api Key
        token:
          type: string
          title: Token
        email:
          type: string
          title: Email
        credits:
          type: number
          title: Credits
      type: object
      required:
      - api_key
      - token
      - email
      - credits
      title: AuthResponse
    BalanceResponse:
      properties:
        credits_remaining:
          type: number
          title: Credits Remaining
        plan:
          type: string
          title: Plan
        email:
          type: string
          title: Email
      type: object
      required:
      - credits_remaining
      - plan
      - email
      title: BalanceResponse
    BatchJobItem:
      properties:
        operation:
          type: string
          pattern: ^(remove-background|add-shadow|upscale|restore-face)$
          title: Operation
        image_url:
          type: string
          title: Image Url
        params:
          additionalProperties: true
          type: object
          title: Params
      type: object
      required:
      - operation
      - image_url
      title: BatchJobItem
    BatchJobStatus:
      properties:
        index:
          type: integer
          title: Index
        generation_id:
          type: string
          title: Generation Id
        status:
          type: string
          title: Status
      type: object
      required:
      - index
      - generation_id
      - status
      title: BatchJobStatus
    BatchRequest:
      properties:
        jobs:
          items:
            $ref: '#/components/schemas/BatchJobItem'
          type: array
          maxItems: 100
          minItems: 1
          title: Jobs
        webhook_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Webhook Url
      type: object
      required:
      - jobs
      title: BatchRequest
    BatchResponse:
      properties:
        batch_id:
          type: string
          title: Batch Id
        total_jobs:
          type: integer
          title: Total Jobs
        total_credits:
          type: number
          title: Total Credits
        jobs:
          items:
            $ref: '#/components/schemas/BatchJobStatus'
