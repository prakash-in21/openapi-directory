      summary: Remove Background
      description: 'Remove background from an image. Returns transparent PNG.


        - Upload image as multipart/form-data

        - Cost: 2 credits ($0.002)

        - Model: BiRefNet (state-of-the-art, MIT license)

        - Typical processing: 1-3 seconds

        - Max file size: 20MB'
      operationId: remove_background_v1_image_remove_background_post
      requestBody:
        content:
