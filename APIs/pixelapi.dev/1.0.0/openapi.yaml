  /v1/payments/refund:
    post:
      tags:
      - Payments
      summary: Process Refund
      description: 'Unified refund endpoint:

        - Users can refund their own latest payment (user_id omitted)

        - Admins (api_key == admin key) can refund any user / payment


        Actions:

        1. Fetch payment record

        2. Refund via PayPal or Razorpay API

        3. Void Zoho invoice

        4. Deduct credits from user

        5. Downgrade plan to free if subscription refund'
      operationId: process_refund_v1_payments_refund_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
        required: true
